{% extends "layout.html" %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-brand-600 animate-ping"></span>
                Executing GeoPulse AI Audit
            </h2>
            <p class="text-xs text-slate-500 mt-1">Querying multi-model AI search engines & analyzing citations...</p>
        </div>
        <span id="progress-percent" class="px-3 py-1 bg-brand-50 text-brand-700 font-extrabold text-sm rounded-full border border-brand-200">0%</span>
    </div>
    
    <div class="mb-6">
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-2">
            <span id="progress-text">Initializing AI models connection...</span>
            <span id="step-counter" class="text-slate-400">Step 0 of 0</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200">
            <div id="progress-bar" class="bg-gradient-to-r from-brand-600 to-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>
    
    <div class="bg-dark-950 text-emerald-400 font-mono text-xs p-5 rounded-xl h-72 overflow-y-auto border border-slate-800 shadow-inner leading-relaxed" id="log-container">
        <!-- Live execution logs -->
    </div>
    
    <div class="mt-6 flex justify-between items-center">
        <div class="flex items-center gap-2 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            Streaming live responses
        </div>
        <a href="/" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-xl transition text-xs font-bold border border-red-200">
            Cancel Run
        </a>
    </div>
</div>

<script>
    const logContainer = document.getElementById('log-container');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const progressPercent = document.getElementById('progress-percent');
    const stepCounter = document.getElementById('step-counter');
    
    const evtSource = new EventSource("/stream");
    
    evtSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        if (data.error) {
            evtSource.close();
            alert("Audit Warning: " + data.error);
            window.location.href = "/dashboard";
            return;
        }
        
        if (data.status === 'complete' && data.redirect) {
            evtSource.close();
            window.location.href = data.redirect;
            return;
        }
        
        const percent = Math.round((data.step / data.total) * 100);
        progressBar.style.width = percent + '%';
        progressPercent.innerText = percent + '%';
        stepCounter.innerText = `Step ${data.step} of ${data.total}`;
        progressText.innerText = `Evaluating query "${data.keyword}" on ${data.platform}...`;
        
        const logLine = document.createElement('div');
        logLine.className = 'mb-1.5 flex items-center justify-between border-b border-slate-900/60 pb-1';
        
        let statusBadge = '';
        if (data.status === 'running') {
            statusBadge = '<span class="text-amber-400 font-semibold">⏳ querying</span>';
        } else if (data.status === 'mentioned') {
            statusBadge = '<span class="text-emerald-400 font-bold">✓ BRAND MENTIONED</span>';
        } else if (data.status === 'not mentioned') {
            statusBadge = '<span class="text-slate-500">✗ ABSENT</span>';
        } else {
            statusBadge = `<span class="text-red-400 font-semibold">⚠️ ${data.status}</span>`;
        }
        
        logLine.innerHTML = `<span><span class="text-slate-500">[${data.step}/${data.total}]</span> <strong class="text-slate-200">"${data.keyword}"</strong> ➔ <span class="text-brand-400 font-semibold">${data.platform}</span></span> ${statusBadge}`;
        
        if (data.status !== 'running') {
            const lines = logContainer.children;
            for (let i = lines.length - 1; i >= 0; i--) {
                if (lines[i].innerHTML.includes(`[${data.step}/${data.total}]`) && lines[i].innerHTML.includes('querying')) {
                    logContainer.removeChild(lines[i]);
                    break;
                }
            }
        }
        
        logContainer.appendChild(logLine);
        logContainer.scrollTop = logContainer.scrollHeight;
    };
    
    evtSource.onerror = function() {
        console.error("EventSource stream connection closed.");
        evtSource.close();
    };
</script>
{% endblock %}
